services:
  datalake:
    image: docker.io/dxflrs/garage:v2.3.0
    restart: unless-stopped
    env_file:
      .env
    command: /garage server --single-node --default-bucket

  backend:
    build:
      context: ./backend
      target: development
      dockerfile: Containerfile
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: /app/package.json
    volumes:
      - ./backend:/app:z
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
      target: development
      dockerfile: Containerfile
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: /app/package.json
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development

volumes:
  bun_cache:
  node_modules:
